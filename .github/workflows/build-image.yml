name: Build and push image

# Counterpart to fddb-exporter's release workflow: that one calls the shared
# itobey/workflow-templates release template (Maven/jar-shaped, so it does not fit this
# Python project). This one stops after the image - release.yml calls pages.yml itself,
# so it is deliberately not called from here.
#
# Two kinds of build: a release reports the bare version declared in app/version.py, and
# anything else reports <version>+<branch>.<sha> so a master image is distinguishable from
# the release it descends from. A build is a release when it was triggered by a tag push,
# or when release.yml called this workflow with `release: true`.
on:
  push:
    branches: [ master ]
    # Release trigger for a hand-pushed tag. Tags in these projects carry no `v` prefix
    # (0.1.0, not v0.1.0). The normal path is release.yml, which calls this workflow
    # directly - a tag it pushes with GITHUB_TOKEN would not trigger this `on: push`.
    tags: [ '*.*.*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to push alongside the commit SHA (e.g. 0.1.0-test)'
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build from'
        required: true
        type: string
      release:
        description: 'Build without a build stamp, so the image reports the bare version'
        required: false
        default: false
        type: boolean
      tag:
        description: 'Extra tag to push alongside the commit SHA'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # IMAGE_NAME carries the owner/repo casing as written on GitHub; GHCR only accepts
      # lowercase paths, so the metadata action gets the lowercased form.
      - name: Compute image reference and build metadata
        id: image
        run: |
          echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
          # A release passes no stamp at all, so app/version.py reports the bare
          # __version__. Everything else is stamped. The sha comes from the checkout
          # rather than from GITHUB_SHA, which points at the caller's commit when
          # release.yml calls this workflow. Short sha on purpose: this ends up in
          # VERSION, and the telemetry endpoint caps appVersion at 32 characters.
          if [ "${RELEASE}" = "true" ] || [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "build=" >> "$GITHUB_OUTPUT"
          else
            # Slashes in a branch name would break PEP 440's local-version syntax.
            echo "build=${GITHUB_REF_NAME//\//-}.$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          fi
        env:
          RELEASE: ${{ inputs.release }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ inputs.release == true }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            APP_BUILD=${{ steps.image.outputs.build }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
